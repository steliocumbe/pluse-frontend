<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#07111f" />

    <!-- Metronic theme (compiled Tailwind v4 + design tokens + kt-* components) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/keenthemes/dist/assets/css/styles.css" />
  </head>
  <body class="antialiased text-base text-foreground bg-background">
    <!-- quasar:entry-point -->

    <!--
      KTUI vendor JS — drives data-kt-* behaviours (drawer, menu, accordion,
      scrollable, sticky, tooltip, etc.) used by the transported Metronic
      sidebar/header markup. Loaded at the end of <body> so DOM is ready.
    -->
    <script src="/keenthemes/dist/assets/js/core.bundle.js"></script>
    <script src="/keenthemes/dist/assets/vendors/ktui/ktui.min.js"></script>
  </body>
</html>
